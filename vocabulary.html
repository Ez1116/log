<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>英文單字學習</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Primary - 紫色系 */
      --md-primary: #7C4DFF;
      --md-primary-hover: #651FFF;
      --md-primary-container: #E8DEF8;
      --md-on-primary: #FFFFFF;
      --md-on-primary-container: #4A148C;

      /* Secondary - 淺紫粉色 */
      --md-secondary: #9C27B0;
      --md-secondary-container: #F3E5F5;

      /* Tertiary - 點綴色 */
      --md-tertiary: #B388FF;
      --md-tertiary-container: #EDE7F6;

      /* Surface - 背景色 */
      --md-surface: #FFFBFE;
      --md-surface-dim: #F5EEFA;
      --md-surface-variant: #F3EDF7;
      --md-surface-container: #F7F2FA;
      --md-surface-container-high: #EDE8F2;

      /* 狀態色 */
      --md-success: #4CAF50;
      --md-success-container: #C8E6C9;
      --md-on-success: #FFFFFF;
      --md-error: #E53935;
      --md-error-container: #FFCDD2;
      --md-on-error: #FFFFFF;

      /* 文字色 */
      --md-on-surface: #1C1B1F;
      --md-on-surface-variant: #49454F;
      --md-outline: #79747E;
      --md-outline-variant: #CAC4D0;

      /* 陰影 */
      --md-elevation-1: 0 1px 3px 1px rgba(0,0,0,0.15), 0 1px 2px rgba(0,0,0,0.3);
      --md-elevation-2: 0 2px 6px 2px rgba(0,0,0,0.15), 0 1px 2px rgba(0,0,0,0.3);
      --md-elevation-3: 0 4px 8px 3px rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.3);
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, var(--md-surface-dim) 0%, var(--md-surface-variant) 100%);
      background-attachment: fixed;
      color: var(--md-on-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .material-symbols-rounded {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Header - 毛玻璃效果 */
    .header {
      background: rgba(255, 251, 254, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--md-on-surface);
      padding: 18px 24px;
      text-align: center;
      font-size: 20px;
      font-weight: 500;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      border-bottom: 1px solid var(--md-outline-variant);
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 76px 16px 100px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }

    /* Page */
    .page {
      display: none;
    }

    .page.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards - MD3 大圓角 */
    .card {
      background: var(--md-surface);
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: var(--md-elevation-1);
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--md-elevation-2);
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--md-on-surface-variant);
      margin-bottom: 8px;
      margin-left: 4px;
    }

    .form-input {
      width: 100%;
      padding: 16px 20px;
      font-size: 16px;
      font-family: inherit;
      border: 2px solid var(--md-outline-variant);
      border-radius: 16px;
      outline: none;
      background: var(--md-surface);
      color: var(--md-on-surface);
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--md-primary);
      box-shadow: 0 0 0 4px rgba(124, 77, 255, 0.1);
    }

    .form-input::placeholder {
      color: var(--md-outline);
    }

    textarea.form-input {
      resize: vertical;
      min-height: 100px;
    }

    /* Buttons - 藥丸形狀 */
    .btn {
      width: 100%;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 500;
      font-family: inherit;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--md-primary);
      color: var(--md-on-primary);
      box-shadow: var(--md-elevation-1);
    }

    .btn-primary:hover {
      background: var(--md-primary-hover);
      box-shadow: var(--md-elevation-2);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      background: var(--md-outline-variant);
      color: var(--md-outline);
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-success {
      background: var(--md-success);
      color: var(--md-on-success);
      box-shadow: var(--md-elevation-1);
    }

    .btn-outline {
      background: var(--md-surface);
      color: var(--md-primary);
      border: 2px solid var(--md-outline-variant);
    }

    .btn-outline:hover {
      background: var(--md-primary-container);
      border-color: var(--md-primary);
    }

    /* Bottom Navigation - MD3 風格 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--md-surface-container);
      display: flex;
      padding: 8px 8px 12px;
      z-index: 100;
      border-top: 1px solid var(--md-outline-variant);
    }

    .nav-item {
      flex: 1;
      padding: 4px 0;
      text-align: center;
      color: var(--md-on-surface-variant);
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      background: none;
      font-size: 12px;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .nav-item .nav-icon {
      width: 64px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      font-size: 24px;
      transition: all 0.2s ease;
    }

    .nav-item.active {
      color: var(--md-on-surface);
    }

    .nav-item.active .nav-icon {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
    }

    .nav-item:hover:not(.active) .nav-icon {
      background: var(--md-surface-container-high);
    }

    /* Record List */
    .record-item {
      padding: 16px 4px;
      border-bottom: 1px solid var(--md-outline-variant);
      transition: background 0.2s ease;
    }

    .record-item:last-child {
      border-bottom: none;
    }

    .record-item:hover {
      background: var(--md-surface-variant);
      margin: 0 -4px;
      padding: 16px 8px;
      border-radius: 16px;
    }

    .record-english {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--md-on-surface);
    }

    .record-chinese {
      font-size: 16px;
      color: var(--md-primary);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .record-context {
      font-size: 14px;
      color: var(--md-on-surface-variant);
      font-style: italic;
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .record-date {
      font-size: 12px;
      color: var(--md-outline);
    }

    /* Quiz Card */
    .quiz-card {
      text-align: center;
      padding: 32px 24px;
    }

    .quiz-english {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--md-on-surface);
      letter-spacing: -0.5px;
    }

    .quiz-context {
      font-size: 15px;
      color: var(--md-on-surface-variant);
      font-style: italic;
      margin-bottom: 32px;
      min-height: 24px;
      line-height: 1.5;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .quiz-option {
      padding: 20px 24px;
      font-size: 18px;
      font-family: inherit;
      border: 2px solid var(--md-outline-variant);
      border-radius: 100px;
      background: var(--md-surface);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      font-weight: 500;
    }

    .quiz-option:hover:not(:disabled) {
      border-color: var(--md-primary);
      background: var(--md-primary-container);
      transform: scale(1.02);
    }

    .quiz-option.correct {
      border-color: var(--md-success);
      background: var(--md-success-container);
      color: #1B5E20;
    }

    .quiz-option.wrong {
      border-color: var(--md-error);
      background: var(--md-error-container);
      color: #B71C1C;
    }

    .quiz-option:disabled {
      cursor: default;
      transform: none;
    }

    .quiz-result {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
      min-height: 40px;
    }

    .quiz-result.correct {
      color: var(--md-success);
    }

    .quiz-result.wrong {
      color: var(--md-error);
    }

    /* Search */
    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .search-box .form-input {
      flex: 1;
      border-radius: 100px;
      padding: 14px 24px;
    }

    .search-box .btn {
      width: auto;
      padding: 14px 28px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--md-on-surface-variant);
    }

    .empty-icon {
      font-size: 56px;
      margin-bottom: 16px;
      opacity: 0.8;
    }

    .empty-state p {
      font-size: 15px;
      line-height: 1.5;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 48px;
      color: var(--md-on-surface-variant);
    }

    .spinner {
      display: inline-block;
      width: 48px;
      height: 48px;
      border: 4px solid var(--md-primary-container);
      border-top-color: var(--md-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast - MD3 Snackbar 風格 */
    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--md-on-surface);
      color: var(--md-surface);
      padding: 14px 24px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 500;
      z-index: 200;
      opacity: 0;
      transition: all 0.3s ease;
      box-shadow: var(--md-elevation-3);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.success {
      background: var(--md-success);
      color: var(--md-on-success);
    }

    .toast.error {
      background: var(--md-error);
      color: var(--md-on-error);
    }

    /* Section Title */
    .section-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--md-primary);
      margin-bottom: 16px;
      margin-left: 4px;
      letter-spacing: 0.5px;
    }

    /* Stats */
    .stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 24px;
      padding: 16px;
      background: var(--md-primary-container);
      border-radius: 20px;
    }

    .stats > div {
      text-align: center;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--md-on-primary-container);
    }

    .stats > div > div:last-child {
      font-size: 13px;
      color: var(--md-on-primary-container);
      opacity: 0.8;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <header class="header" id="header-title">英文單字學習</header>

  <main class="main-content">
    <!-- 記錄頁面 -->
    <div id="page-record" class="page active">
      <div class="card">
        <div class="form-group">
          <label class="form-label">英文單字 / 句子 *</label>
          <input type="text" id="input-english" class="form-input" placeholder="輸入英文..." autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">中文翻譯 *</label>
          <input type="text" id="input-chinese" class="form-input" placeholder="輸入中文翻譯..." autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">情境補充（選填）</label>
          <textarea id="input-context" class="form-input" placeholder="輸入例句或情境..."></textarea>
        </div>
        <button id="btn-save" class="btn btn-primary" onclick="saveRecord()">儲存</button>
      </div>
    </div>

    <!-- 歷史與搜尋頁面 -->
    <div id="page-history" class="page">
      <div class="search-box">
        <input type="text" id="input-search" class="form-input" placeholder="搜尋單字..." autocomplete="off">
        <button class="btn btn-primary" onclick="searchRecords()">搜尋</button>
      </div>

      <div id="search-results" style="display: none;">
        <p class="section-title">搜尋結果</p>
        <div class="card" id="search-list"></div>
      </div>

      <div id="recent-section">
        <p class="section-title">最近三天的紀錄</p>
        <div class="card" id="recent-list">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </div>

    <!-- 複習頁面 -->
    <div id="page-review" class="page">
      <div class="card quiz-card">
        <div class="stats">
          <div>
            <div class="stat-value" id="stat-total">-</div>
            <div>單字總數</div>
          </div>
        </div>

        <div id="quiz-container">
          <div class="quiz-english" id="quiz-english">載入中...</div>
          <div class="quiz-context" id="quiz-context"></div>
          <div class="quiz-options" id="quiz-options"></div>
          <div class="quiz-result" id="quiz-result"></div>
          <button id="btn-next" class="btn btn-primary" onclick="loadQuiz()" style="display: none;">下一題</button>
        </div>

        <div id="quiz-empty" style="display: none;">
          <div class="empty-state">
            <div class="empty-icon">📚</div>
            <p>至少需要 3 個單字才能開始複習</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 底部導航 -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchPage('record')">
      <div class="nav-icon"><span class="material-symbols-rounded">add_circle</span></div>
      <div>記錄</div>
    </button>
    <button class="nav-item" onclick="switchPage('history')">
      <div class="nav-icon"><span class="material-symbols-rounded">history</span></div>
      <div>歷史</div>
    </button>
    <button class="nav-item" onclick="switchPage('review')">
      <div class="nav-icon"><span class="material-symbols-rounded">school</span></div>
      <div>複習</div>
    </button>
  </nav>

  <!-- Toast 通知 -->
  <div id="toast" class="toast"></div>

  <script>
    // ========== 全域變數 ==========
    let currentQuiz = null;
    let answered = false;

    // ========== 頁面切換 ==========
    function switchPage(pageName) {
      // 更新頁面顯示
      document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
      });
      document.getElementById('page-' + pageName).classList.add('active');

      // 更新導航按鈕
      document.querySelectorAll('.nav-item').forEach((item, index) => {
        item.classList.remove('active');
      });
      event.currentTarget.classList.add('active');

      // 更新標題
      const titles = {
        'record': '記錄單字',
        'history': '歷史紀錄',
        'review': '複習測驗'
      };
      document.getElementById('header-title').textContent = titles[pageName];

      // 載入頁面資料
      if (pageName === 'history') {
        loadRecentRecords();
      } else if (pageName === 'review') {
        loadQuiz();
      }
    }

    // ========== 記錄功能 ==========
    async function saveRecord() {
      const english = document.getElementById('input-english').value.trim();
      const chinese = document.getElementById('input-chinese').value.trim();
      const context = document.getElementById('input-context').value.trim();

      if (!english || !chinese) {
        showToast('請填寫英文和中文翻譯', 'error');
        return;
      }

      const btn = document.getElementById('btn-save');
      btn.disabled = true;
      btn.textContent = '儲存中...';

      try {
        const response = await callApi('add', {
          english: english,
          chinese: chinese,
          context: context
        });

        if (response.success) {
          showToast('儲存成功！', 'success');
          // 清空輸入框
          document.getElementById('input-english').value = '';
          document.getElementById('input-chinese').value = '';
          document.getElementById('input-context').value = '';
          // 聚焦到英文輸入框
          document.getElementById('input-english').focus();
        } else {
          showToast(response.error || '儲存失敗', 'error');
        }
      } catch (error) {
        showToast('網路錯誤，請稍後再試', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '儲存';
      }
    }

    // ========== 歷史紀錄功能 ==========
    async function loadRecentRecords() {
      const listEl = document.getElementById('recent-list');
      listEl.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        const response = await callApi('recent');

        if (response.success) {
          renderRecordList(listEl, response.data);
        } else {
          listEl.innerHTML = '<div class="empty-state"><p>' + (response.error || '載入失敗') + '</p></div>';
        }
      } catch (error) {
        listEl.innerHTML = '<div class="empty-state"><p>網路錯誤</p></div>';
      }
    }

    async function searchRecords() {
      const keyword = document.getElementById('input-search').value.trim();

      if (!keyword) {
        document.getElementById('search-results').style.display = 'none';
        return;
      }

      const listEl = document.getElementById('search-list');
      const resultsSection = document.getElementById('search-results');
      resultsSection.style.display = 'block';
      listEl.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        const response = await callApi('search', { keyword: keyword });

        if (response.success) {
          renderRecordList(listEl, response.data);
        } else {
          listEl.innerHTML = '<div class="empty-state"><p>' + (response.error || '搜尋失敗') + '</p></div>';
        }
      } catch (error) {
        listEl.innerHTML = '<div class="empty-state"><p>網路錯誤</p></div>';
      }
    }

    function renderRecordList(container, records) {
      if (!records || records.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><p>沒有紀錄</p></div>';
        return;
      }

      let html = '';
      records.forEach(record => {
        html += '<div class="record-item">';
        html += '<div class="record-english">' + escapeHtml(record.english) + '</div>';
        html += '<div class="record-chinese">' + escapeHtml(record.chinese) + '</div>';
        if (record.context) {
          html += '<div class="record-context">' + escapeHtml(record.context) + '</div>';
        }
        html += '<div class="record-date">' + escapeHtml(record.createdAt) + '</div>';
        html += '</div>';
      });
      container.innerHTML = html;
    }

    // ========== 複習功能 ==========
    async function loadQuiz() {
      answered = false;
      document.getElementById('quiz-result').textContent = '';
      document.getElementById('quiz-result').className = 'quiz-result';
      document.getElementById('btn-next').style.display = 'none';

      const englishEl = document.getElementById('quiz-english');
      const contextEl = document.getElementById('quiz-context');
      const optionsEl = document.getElementById('quiz-options');
      const containerEl = document.getElementById('quiz-container');
      const emptyEl = document.getElementById('quiz-empty');

      englishEl.textContent = '載入中...';
      contextEl.textContent = '';
      optionsEl.innerHTML = '';

      try {
        // 先取得總數
        const countResponse = await callApi('count');
        if (countResponse.success) {
          document.getElementById('stat-total').textContent = countResponse.data.count;
        }

        // 取得題目
        const response = await callApi('quiz');

        if (response.success) {
          containerEl.style.display = 'block';
          emptyEl.style.display = 'none';

          currentQuiz = response.data;
          englishEl.textContent = currentQuiz.english;
          contextEl.textContent = currentQuiz.context || '';

          let optionsHtml = '';
          currentQuiz.options.forEach((option, index) => {
            optionsHtml += '<button class="quiz-option" onclick="selectAnswer(' + index + ')" data-correct="' + option.isCorrect + '">';
            optionsHtml += escapeHtml(option.text);
            optionsHtml += '</button>';
          });
          optionsEl.innerHTML = optionsHtml;
        } else {
          containerEl.style.display = 'none';
          emptyEl.style.display = 'block';
        }
      } catch (error) {
        englishEl.textContent = '載入失敗';
      }
    }

    function selectAnswer(index) {
      if (answered) return;
      answered = true;

      const options = document.querySelectorAll('.quiz-option');
      const selectedOption = options[index];
      const isCorrect = selectedOption.dataset.correct === 'true';

      // 標記所有選項
      options.forEach(option => {
        option.disabled = true;
        if (option.dataset.correct === 'true') {
          option.classList.add('correct');
        } else if (option === selectedOption) {
          option.classList.add('wrong');
        }
      });

      // 顯示結果
      const resultEl = document.getElementById('quiz-result');
      if (isCorrect) {
        resultEl.textContent = '正確！';
        resultEl.className = 'quiz-result correct';
      } else {
        resultEl.textContent = '答錯了～';
        resultEl.className = 'quiz-result wrong';
      }

      // 顯示下一題按鈕
      document.getElementById('btn-next').style.display = 'block';
    }

    // ========== API 呼叫 ==========
    async function callApi(action, params = {}) {
      const baseUrl = 'https://script.google.com/macros/s/AKfycbxrg1Dx50FGZU7Av9pDBrT9TTPyftYG0gDnED75AL5tvhAKXMA3Rewph1xNlJWSdB7h/exec';
      const allParams = { action, ...params };
      const queryString = new URLSearchParams(allParams).toString();
      const response = await fetch(baseUrl + '?' + queryString);
      return await response.json();
    }

    // ========== 工具函數 ==========
    function showToast(message, type = '') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show ' + type;

      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ========== 鍵盤事件 ==========
    document.addEventListener('keydown', function(e) {
      // Enter 鍵儲存（在記錄頁面）
      if (e.key === 'Enter' && !e.shiftKey) {
        const activeEl = document.activeElement;
        if (activeEl.id === 'input-english' || activeEl.id === 'input-chinese') {
          e.preventDefault();
          saveRecord();
        } else if (activeEl.id === 'input-search') {
          e.preventDefault();
          searchRecords();
        }
      }
    });
  </script>
</body>
</html>
